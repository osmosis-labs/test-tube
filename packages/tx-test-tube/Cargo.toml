[package]
description = "CosmWasm integration testing for TX"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tokenieze-x/tx-test-tube"
name = "tx-test-tube"
version = "5.0.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

exclude = ["tx", "test_artifacts"]

[dependencies]
cosmrs = { workspace = true, features = ["cosmwasm"] }
cosmwasm-std = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
test-tube-tx = { version = "5.0.0", path = "../test-tube" }
tx-wasm-sdk = { package = "tx-wasm-sdk", git = "https://github.com/CoreumFoundation/coreum-wasm-sdk", branch = "mehdi/rename-tokenize-x"}

[build-dependencies]
bindgen = "0.69.4"

[dev-dependencies]
cw1-whitelist = { workspace = true }
bech32 = "0.11.0"
ring = "0.17.8"
