[workspace]

members = [
  "packages/*",
]

resolver = "2"

[workspace.dependencies]
# Shared dependencies
cosmrs = { version = "0.16.0", features = ["cosmwasm", "rpc"] }
cosmwasm-std = { version = "2.1.4", features = ["cosmwasm_2_0"] }
prost = "0.12.6"
serde = "1.0.203"
serde_json = "1.0.117"

# Dev dependencies
cw1-whitelist = "2.0.0"
